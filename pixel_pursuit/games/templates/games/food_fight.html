{% load static %}

<html>
<head>
    {% include 'elements/includes.html' %}
    <title>Food Fighters</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        
    </style>
    <link rel="stylesheet" href="{% static 'food_fight/styles.css' %}">
</head>
<body class="arena-bg">

    {% include 'elements/navbar.html' with active="foodfighters" %}

    <div class="d-flex flex-column w-100 pt-2 pb-2 blue">
        <div class="vstack h-100">
            <div class="container-fluid text-center h-100 pt-3">
                <div class="row mb-5">
                    <div class="col-11">
                        <div class="market-arena">

                            <!-- Canopy -->
                            <div class="canopy"></div>

                            <div class="canopy-title">
                                Food Fighters
                            </div>

                            <!-- Posts -->
                            <div class="post left-post"></div>
                            <div class="post right-post"></div>

                            <!-- Battle Space -->
                            <div class="battle-stage">

                                <!-- PLAYER SELECTION OVERLAY -->
                                <div id="playerSelection" class="player-selection-overlay">
                                    <div class="container">
                                        <div class="row justify-content-center" id="playerCardsContainer">
                                            <!-- Cards injected here via JS -->
                                        </div>
                                    </div>
                                </div>
                                    
                                <!-- Enemy (top right) -->
                                <div class="fighter enemy hidden">
                                    <h5 id="enemyName">The Heatwave Hero</h5>
                                    <div class="hp-bar">
                                        <div id="enemyHP" class="hp-fill"></div>
                                    </div>
                                    <img id="enemySprite" class="fighter-img" src="{% static 'food_fight/assets/chili.png' %}">
                                </div>

                                <!-- Player (bottom left) -->
                                <div class="fighter player hidden">
                                    <img id="playerSprite" class="fighter-img" src="{% static 'food_fight/assets/tomato.png' %}">
                                    <div class="hp-bar">
                                        <div id="playerHP" class="hp-fill"></div>
                                    </div>
                                </div>

                            </div>

                            <!-- Counter -->
                            <div class="counter">
                                <div class="crate-row">
                                    
                                    <!-- Actions -->
                                    <div class="crate">
                                        <h5 id="actionsTitle">Actions (⚡)</h5>
                                        <div class="row g-2">
                                            <div class="col-6">
                                                <button class="move-btn" data-move="attack1">Attack 1</button>
                                            </div>
                                            <div class="col-6">
                                                <button class="move-btn" data-move="attack2">Attack 2</button>
                                            </div>
                                            <div class="col-6">
                                                <button class="move-btn" data-move="special">Special</button>
                                            </div>
                                            <div class="col-6">
                                                <button class="move-btn" data-move="defend">Guard</button>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Log -->
                                    <div class="crate">
                                        <h5>Market Log</h5>
                                        <div id="battleLog" class="battle-log">
                                            <p>Stand is open!</p>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-1 d-flex justify-content-start">
                        <div class="battle-tracker">
                            <div class="tracker-line">
                                <div class="tracker-fill" id="trackerFill"></div>
                            </div>
                            <i id="circle-5" class="circle top-circle fa-regular fa-star"></i>
                            <i id="circle-4" class="circle fa-regular fa-star"></i>
                            <i id="circle-3" class="circle fa-regular fa-star"></i>
                            <i id="circle-2" class="circle fa-regular fa-star"></i>
                            <i id="circle-1" class="circle fa-regular fa-star"></i>
                        </div>
                    </div>
                    <!-- JS logic -->
                    <script type="module" src="{% static 'food_fight/game.js' %}"></script>
                </div>
            </div>
        </div>
    </div>
    <!-- End Game Modal -->
    <div class="modal fade" id="endGameModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content battle-card text-white">
                <div class="modal-header">
                    <h5 class="modal-title">Battle Over</h5>
                </div>
                <div class="modal-body text-center">
                    <p id="battleResult">You Win!</p>
                    <p>Play again?</p>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" id="newBattleBtn">New Battle</button>
                </div>
            </div>
        </div>
    </div>
    {% include 'elements/achieve_message.html' %}
</body>
</html>
